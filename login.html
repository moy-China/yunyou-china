<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录 · 云游中国</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>欢迎回来 👋</h1>
      <p class="sub">登录后即可留言评论、收藏心仪的景点。</p>
      <form id="loginForm">
        <div class="field"><label>用户名</label><input id="username" type="text" placeholder="请输入用户名" autocomplete="username" required></div>
        <div class="field"><label>密码</label><input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">登录</button>
      </form>
      <div class="hint" style="text-align:center;margin-top:12px;color:var(--muted);font-size:12.5px">演示账号：d*** / ******（如需体验请联系管理员）</div>
      <div class="auth-foot">还没有账号？<a href="register.html">立即注册</a></div>
    </div>
  </div>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value.trim();
      var p = document.getElementById('password').value;
      if (!u || !p) { toast('请输入用户名和密码', 'error'); return; }
      var r = Store.login(u, p);
      if (r.error) { toast(r.error, 'error'); return; }
      toast('登录成功，欢迎回来', 'success');
      var back = qs('back');
      setTimeout(function () { location.href = back ? back : 'index.html'; }, 600);
    });
  </script>
</body>
</html>
