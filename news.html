<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅游资讯 · 云游中国</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <header class="page-hero">
    <div class="container">
      <h1>旅游资讯</h1>
      <p>最新出行动态、实用攻略与站点公告，助你玩得更聪明。</p>
    </div>
  </header>

  <div class="container">
    <div class="filter-bar">
      <div class="chips" id="chips"></div>
    </div>
    <div class="result-info" id="resultInfo"></div>
    <div class="news-grid" id="newsList"></div>
    <div id="emptyState" class="empty" style="display:none">
      <div class="big">📰</div><p>暂无该分类下的资讯。</p>
    </div>
  </div>

  <div id="footer"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var cats = ['全部', '资讯', '攻略', '公告'];
      var cur = qs('cat') || '全部';

      function renderChips() {
        document.getElementById('chips').innerHTML = cats.map(function (c) {
          return '<button class="chip' + (c === cur ? ' active' : '') + '" data-c="' + c + '">' + c + '</button>';
        }).join('');
        document.querySelectorAll('#chips .chip').forEach(function (b) {
          b.addEventListener('click', function () { cur = b.getAttribute('data-c'); renderChips(); render(); });
        });
      }

      function render() {
        var list = Store.all('news').filter(function (n) { return n.status === 'published'; });
        if (cur !== '全部') list = list.filter(function (n) { return n.category === cur; });
        list.sort(function (a, b) { return b.date.localeCompare(a.date); });
        document.getElementById('resultInfo').textContent = '共 ' + list.length + ' 条资讯' + (cur !== '全部' ? '（' + cur + '）' : '');
        document.getElementById('newsList').innerHTML = list.map(function (n) {
          var img = n.cover ? asset(n.cover + '-cover.jpg') : asset('xihu-cover.jpg');
          return '<a class="news-card" href="news-detail.html?id=' + encodeURIComponent(n.id) + '">' +
            '<div class="cover"><img src="' + img + '" alt="' + esc(n.title) + '" loading="lazy"></div>' +
            '<div class="body"><span class="cat">' + esc(n.category) + '</span><h3>' + esc(n.title) + '</h3>' +
            '<p class="summary">' + esc(n.summary) + '</p><div class="date">' + esc(n.date) + '</div></div></a>';
        }).join('');
        document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
      }

      renderChips();
      render();
    });
  </script>
</body>
</html>
