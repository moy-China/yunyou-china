<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资讯详情 · 云游中国</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container" id="root" style="padding:30px 0 10px"></div>

  <div id="footer"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var root = document.getElementById('root');
      var n = Store.get('news', qs('id'));
      if (!n) {
        root.innerHTML = '<div class="empty"><div class="big">📄</div><p>未找到该资讯。</p><a class="btn btn-primary" href="news.html">返回资讯列表</a></div>';
        return;
      }
      document.title = n.title + ' · 云游中国';
      var img = n.cover ? asset(n.cover + '-cover.jpg') : asset('xihu-cover.jpg');
      root.innerHTML =
        '<div class="crumb"><a href="index.html">首页</a> / <a href="news.html">旅游资讯</a> / ' + esc(n.category) + '</div>' +
        '<article style="max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 38px">' +
        '<span class="tag">' + esc(n.category) + '</span>' +
        '<h1 style="font-size:27px;margin:14px 0 10px">' + esc(n.title) + '</h1>' +
        '<div style="color:var(--muted);font-size:13px;margin-bottom:20px">📅 ' + esc(n.date) + ' · ' + esc(Store.settings().siteName) + '</div>' +
        '<img src="' + img + '" alt="' + esc(n.title) + '" style="border-radius:14px;margin-bottom:22px;width:100%;aspect-ratio:16/9;object-fit:cover">' +
        '<div class="prose">' + n.content.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>' +
        '<div style="border-top:1px solid var(--line);margin-top:24px;padding-top:18px"><a class="btn btn-ghost" href="news.html">← 返回资讯列表</a></div></article>';
    });
  </script>
</body>
</html>
