<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言管理 · 云游中国后台</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="a-card">
          <div class="head">
            <h2>💬 留言评论</h2><div class="spacer"></div>
            <div class="toolbar">
              <select class="a-select" id="spotSel"><option value="全部">全部景点</option></select>
              <select class="a-select" id="statusSel"><option value="全部">全部状态</option><option value="published">已展示</option><option value="hidden">已隐藏</option></select>
            </div>
          </div>
          <div class="body" style="padding:0">
            <div style="overflow-x:auto">
              <table class="a-table">
                <thead><tr><th>留言人</th><th>所属景点</th><th>评分</th><th>留言内容</th><th>日期</th><th>状态</th><th style="width:170px">操作</th></tr></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <div id="emptyState" class="empty" style="display:none"><div class="big">💬</div><p>暂无留言。</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      renderShell('comments', '留言管理');
      var spot = '全部', status = '全部';

      var spots = Store.all('attractions');
      document.getElementById('spotSel').innerHTML = '<option value="全部">全部景点</option>' + spots.map(function (a) {
        return '<option value="' + a.id + '">' + esc(a.name) + '</option>';
      }).join('');
      document.getElementById('spotSel').addEventListener('change', function () { spot = this.value; render(); });
      document.getElementById('statusSel').addEventListener('change', function () { status = this.value; render(); });

      function render() {
        var list = Store.all('comments');
        if (spot !== '全部') list = list.filter(function (c) { return c.attractionId === spot; });
        if (status !== '全部') list = list.filter(function (c) { return c.status === status; });
        list.sort(function (a, b) { return b.date.localeCompare(a.date); });
        document.getElementById('tbody').innerHTML = list.map(function (c) {
          var a = Store.get('attractions', c.attractionId);
          return '<tr><td><div style="display:flex;align-items:center;gap:9px"><span class="avatar" style="width:30px;height:30px;font-size:13px">' + esc(c.username.charAt(0)) + '</span>' + esc(c.username) + '</div></td>' +
            '<td>' + (a ? esc(a.name) : '<span class="text-muted">已删除景点</span>') + '</td>' +
            '<td>' + starsHTML(c.rating) + '</td>' +
            '<td style="max-width:340px"><div style="overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">' + esc(c.content) + '</div></td>' +
            '<td class="text-muted">' + esc(c.date) + '</td>' +
            '<td><span class="pill ' + (c.status === 'published' ? 'on' : 'off') + '">' + (c.status === 'published' ? '已展示' : '已隐藏') + '</span></td>' +
            '<td><div class="row-actions">' +
            '<button class="a-btn a-btn-ghost a-btn-sm" data-act="view" data-id="' + c.id + '">查看</button>' +
            '<button class="a-btn a-btn-ghost a-btn-sm" data-act="toggle" data-id="' + c.id + '">' + (c.status === 'published' ? '隐藏' : '恢复') + '</button>' +
            '<button class="a-btn a-btn-danger a-btn-sm" data-act="del" data-id="' + c.id + '">删除</button></div></td></tr>';
        }).join('');
        document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
      }

      document.getElementById('tbody').addEventListener('click', function (e) {
        var btn = e.target.closest('button'); if (!btn) return;
        var id = btn.getAttribute('data-id'); var act = btn.getAttribute('data-act');
        var c = Store.get('comments', id);
        var a = Store.get('attractions', c.attractionId);
        if (act === 'view') {
          openModal('留言详情 · ' + c.username, '<div style="margin-bottom:12px"><b>' + esc(c.username) + '</b> 对 ' +
            '<b>' + (a ? esc(a.name) : '未知景点') + '</b> 的评价 ' + starsHTML(c.rating) + '</div>' +
            '<p style="margin:0;background:#f7faf9;border-radius:10px;padding:14px;font-size:14.5px;color:var(--text)">' + esc(c.content) + '</p>' +
            '<div class="text-muted" style="margin-top:10px">' + esc(c.date) + '</div>', '');
        } else if (act === 'toggle') {
          c.status = c.status === 'published' ? 'hidden' : 'published';
          Store.save('comments', c); toast('已' + (c.status === 'published' ? '恢复展示' : '隐藏该留言'), 'success'); render();
        } else if (act === 'del') {
          mConfirm('确定删除这条留言吗？删除后不可恢复。', function () { Store.remove('comments', id); toast('留言已删除', 'success'); render(); });
        }
      });

      render();
    });
  </script>
</body>
</html>
