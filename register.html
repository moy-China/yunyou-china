<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册账号 · 云游中国</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>创建账号 🚀</h1>
      <p class="sub">注册后即可收藏景点、发表留言评论。</p>
      <form id="regForm">
        <div class="field"><label>用户名</label><input id="username" type="text" placeholder="4–16 位字母、数字或下划线" autocomplete="username" required></div>
        <div class="field"><label>昵称</label><input id="nickname" type="text" placeholder="显示在留言中的名字" required></div>
        <div class="field"><label>密码</label><input id="password" type="password" placeholder="至少 6 位" autocomplete="new-password" required></div>
        <div class="field"><label>确认密码</label><input id="password2" type="password" placeholder="再次输入密码" autocomplete="new-password" required></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">注册</button>
      </form>
      <div class="auth-foot">已有账号？<a href="login.html">直接登录</a></div>
    </div>
  </div>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value.trim();
      var nick = document.getElementById('nickname').value.trim();
      var p = document.getElementById('password').value;
      var p2 = document.getElementById('password2').value;
      if (!/^[a-zA-Z0-9_]{4,16}$/.test(u)) { toast('用户名需为 4–16 位字母、数字或下划线', 'error'); return; }
      if (!nick) { toast('请输入昵称', 'error'); return; }
      if (p.length < 6) { toast('密码至少 6 位', 'error'); return; }
      if (p !== p2) { toast('两次输入的密码不一致', 'error'); return; }
      if (Store.find('users', function (x) { return x.username === u; })) { toast('该用户名已被占用', 'error'); return; }
      Store.save('users', {
        id: Store.uid('u'), username: u, nickname: nick, password: p,
        role: 'user', status: 'active', createdAt: new Date().toISOString().slice(0, 10)
      });
      Store.login(u, p);
      toast('注册成功，已自动登录', 'success');
      setTimeout(function () { location.href = 'index.html'; }, 700);
    });
  </script>
</body>
</html>
